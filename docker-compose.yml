# Only nginx is reachable from outside. MongoDB and MinIO live on an
# `internal` network with no published ports, so their credentials and
# data can only be reached through the Next.js app.
services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [edge]
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on: [mongo, minio]
    networks: [edge, internal]
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes: [mongo_data:/data/db]
    networks: [internal]
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    networks: [internal]
    restart: unless-stopped

networks:
  edge: {}
  internal:
    internal: true

volumes:
  mongo_data:
  minio_data:
