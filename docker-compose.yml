# Only nginx (web) is reachable from outside. MongoDB and MinIO/SeaweedFS live on an
# `internal` network with no published ports, so their credentials and
# data can only be reached through the Next.js app.
#
# Production ingress is provided by Traefik on dokploy-network.
services:
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [edge, dokploy-network]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - "traefik.http.routers.multiconw.rule=Host(`${DOMAIN:?DOMAIN must be set}`)"
      - traefik.http.services.multiconw.loadbalancer.server.port=80

  app:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/multiconw?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes: [mongo_data:/data/db]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping: 1})' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/usr/bin/weed"]
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0"]
    volumes: [minio_data:/data]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  edge: {}
  internal:
    internal: true
  dokploy-network:
    external: true

volumes:
  mongo_data:
  minio_data:
